    <g fill="#0F172A" stroke="#FFFFFF" stroke-opacity="0.14">
      <rect x="848" y="228" width="64" height="28" rx="10" fill="#0F172A" fill-opacity="0.56"/>
      <rect x="964" y="228" width="64" height="28" rx="10" fill="#0F172A" fill-opacity="0.56"/>
      <rect x="1080" y="228" width="64" height="28" rx="10" fill="#0F172A" fill-opacity="0.56"/>
      <rect x="1160" y="228" width="44" height="28" rx="10" fill="#0F172A" fill-opacity="0.56"/>
