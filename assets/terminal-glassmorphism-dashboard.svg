    <rect x="942" y="98" width="82" height="36" rx="12" fill="#0F172A" fill-opacity="0.54" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="1036" y="98" width="82" height="36" rx="12" fill="#0F172A" fill-opacity="0.54" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="1130" y="98" width="64" height="36" rx="12" fill="#0F172A" fill-opacity="0.54" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <text x="868" y="119" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">99.95%</text>
    <text x="958" y="119" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">148</text>
    <text x="1050" y="119" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">12</text>
    <text x="1144" y="119" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">&lt;15m</text>

    <text x="868" y="132" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="10">uptime</text>
    <text x="958" y="132" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="10">pipelines</text>
    <text x="1050" y="132" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="10">services</text>
    <text x="1144" y="132" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="10">mttr</text>
  </g>

  <g>
    <rect x="818" y="172" width="406" height="120" rx="22" fill="url(#panelFill)" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="848" y="206" fill="#E5ECF6" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Delivery Flow</text>

    <g stroke="url(#accent)" stroke-width="1.7" stroke-linecap="round" filter="url(#softGlow)">
      <path d="M880 242H946"/>
      <path d="M996 242H1062"/>
      <path d="M1112 242H1178"/>
