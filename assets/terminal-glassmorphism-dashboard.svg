    <text x="860" y="246" fill="#DCE6FF" font-family="Segoe UI, Arial, sans-serif" font-size="11">GitHub</text>
    <text x="977" y="246" fill="#DCE6FF" font-family="Segoe UI, Arial, sans-serif" font-size="11">Docker</text>
    <text x="1088" y="246" fill="#DCE6FF" font-family="Segoe UI, Arial, sans-serif" font-size="11">K8s</text>
    <text x="1170" y="246" fill="#DCE6FF" font-family="Segoe UI, Arial, sans-serif" font-size="11">Obs</text>

    <text x="848" y="278" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Source -> Build -> Containers -> Runtime -> Monitoring</text>
