  <g opacity="0.18" stroke="#60A5FA" stroke-width="1.2">
    <path d="M0 332C180 300 320 346 500 320C690 292 840 256 1280 315" />
    <path d="M0 308C250 270 420 312 610 286C812 258 1000 238 1280 272" />
