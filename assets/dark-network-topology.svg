    <path d="M1072 172L1180 132" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 8" />
    <path d="M748 274L650 320" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 8" />
