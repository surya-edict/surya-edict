  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="92" y="138" fill="#F8FAFC" font-size="42" font-weight="700">Surya Pratap Singh</text>
    <text x="92" y="176" fill="#7DD3FC" font-size="20" font-weight="600">DevOps Engineer | Cloud Infrastructure | Platform Reliability</text>
    <text x="92" y="214" fill="#CBD5E1" font-size="16">Building resilient delivery pipelines, secure cloud platforms, and observable systems.</text>
    <text x="92" y="246" fill="#93C5FD" font-size="14">AWS  ·  Kubernetes  ·  Terraform  ·  CI/CD  ·  Docker  ·  Monitoring</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#C7D2FE" fill-opacity="0.9">
