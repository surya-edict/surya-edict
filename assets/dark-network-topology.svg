<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Surya Pratap Singh DevOps hero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070B14" />
      <stop offset="0.55" stop-color="#0B1220" />
      <stop offset="1" stop-color="#0A1628" />
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 182) rotate(90) scale(180 280)">
      <stop stop-color="#22D3EE" stop-opacity="0.22" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 120) rotate(90) scale(120 200)">
      <stop stop-color="#60A5FA" stop-opacity="0.18" />
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)" />
  <rect width="1280" height="360" fill="url(#glowA)" />
  <rect width="1280" height="360" fill="url(#glowB)" />

  <g stroke="#1F2A44" stroke-opacity="0.5" stroke-width="1">
